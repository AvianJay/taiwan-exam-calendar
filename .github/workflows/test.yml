name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-ocr.txt
          python -c "from src.pdf_utils import ocr_available; print('OCR fallback available:', ocr_available())"

      - name: Run tests (offline fixtures, no network)
        run: python -m pytest -q

      - name: Validate committed data
        run: python -m src.validate data/exams.json
