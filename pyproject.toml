[project]
name = "taiwan-exam-calendar"
version = "1.0.0"
description = "從台灣官方教育考試網站抓取考試／升學重要日期，產生機器可讀 JSON"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0",
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=4.30",
    "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime==1.2.3"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
